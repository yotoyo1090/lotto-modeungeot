<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="분배 모델: 당첨 확률은 같아도, 1등을 나눠 가질 사람 수는 모양에 따라 최대 약 1.4배 차이" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17150F"/><stop offset="1" stop-color="#2B2414"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7A5C12"/><stop offset="1" stop-color="#F3DA86"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6B2F28"/><stop offset="1" stop-color="#E08A7E"/></linearGradient>
    <style>.k{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.f{font-family:Georgia,'Times New Roman',serif}</style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="598" rx="23" fill="none" stroke="#C9A227" stroke-opacity="0.35"/>

  <text x="56" y="74" class="k" font-size="15" letter-spacing="3" fill="#C9A227" font-weight="700">분배 모델 · 로또 모든것의 핵심 무기</text>
  <text x="56" y="118" class="k" font-size="32" font-weight="800" fill="#FBFAF7">당첨 확률은 누구도 못 바꿉니다.</text>
  <text x="56" y="160" class="k" font-size="32" font-weight="800" fill="#F3DA86">나눠 가질 사람 수는 고를 수 있습니다.</text>

  <!-- left : explanation -->
  <g class="k" font-size="16" fill="#CFC8B6">
    <text x="56" y="214">1등은 정해진 금액이 아니라 <tspan fill="#FBFAF7" font-weight="700">당첨자끼리 나누는 몫</tspan>입니다.</text>
    <text x="56" y="240">사람들이 즐겨 고르는 모양(생일 숫자, 붙은 번호, 좁은 간격)이</text>
    <text x="56" y="266">나오면 몫이 잘게 쪼개집니다.</text>
  </g>

  <g class="k" transform="translate(56 300)">
    <text x="0" y="0" font-size="14" fill="#8E887A" letter-spacing="1">모델이 보는 세 가지</text>
    <g transform="translate(0 20)">
      <rect width="420" height="50" rx="12" fill="#FBFAF7" fill-opacity="0.05" stroke="#C9A227" stroke-opacity="0.3"/>
      <text x="18" y="31" font-size="16" fill="#FBFAF7" font-weight="700">① 9 이하 번호</text>
      <text x="402" y="31" font-size="14" fill="#8E887A" text-anchor="end">달력 날짜 — 많이 골라짐</text>
    </g>
    <g transform="translate(0 80)">
      <rect width="420" height="50" rx="12" fill="#FBFAF7" fill-opacity="0.05" stroke="#C9A227" stroke-opacity="0.3"/>
      <text x="18" y="31" font-size="16" fill="#FBFAF7" font-weight="700">② 연속 번호</text>
      <text x="402" y="31" font-size="14" fill="#8E887A" text-anchor="end">3쌍 이상이면 급증</text>
    </g>
    <g transform="translate(0 140)">
      <rect width="420" height="50" rx="12" fill="#FBFAF7" fill-opacity="0.05" stroke="#C9A227" stroke-opacity="0.3"/>
      <text x="18" y="31" font-size="16" fill="#FBFAF7" font-weight="700">③ 번호 간격</text>
      <text x="402" y="31" font-size="14" fill="#8E887A" text-anchor="end">20 이하로 좁으면 많이 골라짐</text>
    </g>
  </g>

  <!-- right : out-of-sample result -->
  <g class="k" transform="translate(600 200)">
    <rect width="544" height="330" rx="18" fill="#FBFAF7" fill-opacity="0.04" stroke="#C9A227" stroke-opacity="0.35"/>
    <text x="28" y="40" font-size="15" fill="#FBFAF7" font-weight="700">사후 검증 — 1~619회로 만든 모델을 620~1,238회에 적용</text>
    <text x="28" y="64" font-size="13" fill="#8E887A">실제 1등 당첨자 수 ÷ 판매량으로 기대되는 수 (1.00 = 평균)</text>

    <line x1="40" y1="276" x2="504" y2="276" stroke="#FBFAF7" stroke-opacity="0.2"/>
    <!-- scale: 1.00 = 120px ; base y=276 -->
    <line x1="40" y1="156" x2="504" y2="156" stroke="#FBFAF7" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <text x="504" y="150" font-size="12" fill="#8E887A" text-anchor="end">평균 1.00</text>

    <rect x="110" y="159.6" width="110" height="116.4" rx="8" fill="url(#g1)"/>
    <text x="165" y="146" class="f" font-size="30" font-weight="700" fill="#F3DA86" text-anchor="middle">0.97</text>
    <text x="165" y="300" font-size="14" fill="#FBFAF7" text-anchor="middle" font-weight="700">「적게 팔린다」 예측</text>

    <rect x="324" y="112.8" width="110" height="163.2" rx="8" fill="url(#g2)"/>
    <text x="379" y="100" class="f" font-size="30" font-weight="700" fill="#F0A89E" text-anchor="middle">1.36</text>
    <text x="379" y="300" font-size="14" fill="#FBFAF7" text-anchor="middle" font-weight="700">「많이 팔린다」 예측</text>

    <text x="272" y="322" font-size="13" fill="#CFC8B6" text-anchor="middle">같은 1등이라도 한 사람 몫이 약 <tspan fill="#F3DA86" font-weight="700">1.4배</tspan> 차이</text>
  </g>

  <text x="56" y="566" class="k" font-size="13" fill="#8E887A">근거 : 1,238회 1등 당첨자 10,601명 (5등 당첨자 수로 추정한 기대값 10,603.3명) · 포아송 회귀, 과산포 보정 · 코드 <tspan fill="#CFC8B6">src/core/sharing.js</tspan> — 확률이 아니라 분배를 다룹니다.</text>
</svg>
